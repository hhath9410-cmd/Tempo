<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tempo</title>
<style>
:root{--ink:#171717;--muted:#8e8e8e;--paper:#fff;--wash:#f6f6f6;--soft:#ededed;--accent:#ef6ad0}*{box-sizing:border-box}body{margin:0;background:#ededed;color:var(--ink);font:13px Arial,sans-serif}.phone{width:min(100%,430px);min-height:100vh;min-height:100dvh;margin:auto;background:var(--paper);padding:calc(18px + env(safe-area-inset-top)) 20px calc(87px + env(safe-area-inset-bottom));position:relative}.top{height:37px;display:flex;align-items:center;justify-content:center}.top h1{font-size:15px;margin:0}.screen{display:none}.screen.active{display:block}.date-title{font-size:24px;letter-spacing:-.8px;margin:24px 0 3px}.subtle{font-size:11px;color:var(--muted);margin:0}.progress-wrap{margin:21px 0 24px}.progress-meta{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:7px}.progress{height:6px;border-radius:8px;background:var(--soft);overflow:hidden}.progress div{height:100%;background:var(--ink);border-radius:8px;transition:.2s}.task-list{display:grid;gap:9px}.task{display:flex;gap:10px;align-items:flex-start;background:var(--wash);border-radius:12px;padding:12px}.task input{appearance:none;width:17px;height:17px;border:1px solid #b9b9b9;border-radius:50%;margin:1px 0 0;flex:none}.task input:checked{background:var(--ink);border-color:var(--ink)}.task input:checked:after{content:'✓';display:block;color:#fff;font-size:11px;text-align:center;line-height:15px}.task-name{font-size:12px;font-weight:700}.task-meta{display:block;font-size:10px;color:var(--muted);margin-top:4px}.done .task-name{text-decoration:line-through;color:#999}.task-content{flex:1}.task-actions{display:flex;gap:5px;margin-left:auto}.task-action{border:0;background:transparent;color:var(--muted);font-size:10px;padding:2px 0}.task-action:hover{color:var(--ink)}.empty{color:var(--muted);font-size:11px;text-align:center;padding:24px}.quick-add{margin-top:22px;background:var(--ink);color:#fff;border:0;border-radius:13px;width:100%;padding:13px;font-weight:700}.form-card{margin-top:13px;background:var(--wash);border-radius:14px;padding:14px;display:none}.form-card.open{display:block}.form-card input,.form-card select{width:100%;height:37px;border:0;border-radius:8px;background:#fff;padding:0 10px;font-size:11px;margin-bottom:9px}.form-card label{display:block;font-size:10px;color:#666;margin:2px 0 5px}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.toggle{display:flex;gap:4px;background:#e4e4e4;border-radius:8px;padding:3px;margin-bottom:10px}.toggle button{flex:1;border:0;background:transparent;border-radius:6px;padding:7px 3px;font-size:10px}.toggle button.active{background:#fff;font-weight:700}.checkline{display:flex!important;align-items:center;gap:7px;color:var(--ink)!important;margin:8px 0 13px!important}.checkline input{width:15px;height:15px;margin:0;accent-color:#111}.save{width:100%;border:0;background:var(--ink);color:white;border-radius:8px;padding:10px;font-weight:700}.calendar-head{display:flex;justify-content:space-between;align-items:center;margin:17px 0 14px}.calendar-head h2{font-size:17px;margin:0}.calendar-head button{border:0;background:var(--wash);border-radius:8px;width:30px;height:30px;font-size:17px}.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}.week{color:var(--muted);font-size:9px;margin-bottom:7px}.day{height:43px;border:0;background:white;position:relative;font-size:10px}.day span{display:grid;place-items:center;width:27px;height:27px;margin:auto;border-radius:50%}.day.out{color:#c9c9c9}.day.selected span{background:var(--ink);color:#fff}.day.has:after{content:'';position:absolute;width:4px;height:4px;background:var(--accent);border-radius:50%;bottom:3px;left:calc(50% - 2px)}.day.selected:after{background:#fff}.cal-summary{margin-top:22px;background:var(--wash);border-radius:13px;padding:14px}.cal-summary h3{font-size:12px;margin:0 0 7px}.cal-summary .task{background:#fff;margin-top:7px}.bottom{position:absolute;left:0;right:0;bottom:0;height:calc(67px + env(safe-area-inset-bottom));padding:8px 14px env(safe-area-inset-bottom);background:#fff;display:flex;justify-content:space-around;box-shadow:0 -6px 22px rgba(0,0,0,.035)}.bottom button{border:0;background:transparent;color:#999;font-size:9px;min-width:72px;display:grid;justify-items:center;gap:3px}.bottom i{font-style:normal;font-size:18px;line-height:18px}.bottom button.active{color:var(--ink);font-weight:bold}.bottom .add i{background:var(--ink);color:#fff;border-radius:7px;width:25px;height:25px;display:grid;place-items:center;font-size:19px}@media(min-width:600px){body{padding:28px}.phone{min-height:780px;border-radius:24px;box-shadow:0 18px 50px #bbb}}
</style>
</head>
<body>
<main class="phone">
<header class="top">
<h1 id="title">Tempo</h1>
</header>
<section class="screen active" id="tasksScreen">
<h2 class="date-title" id="taskHeading">Tuesday</h2>
<p class="subtle" id="taskDate">
</p>
<div class="progress-wrap">
<div class="progress-meta">
<span>Day progress</span>
<span id="progressText">0%</span>
</div>
<div class="progress">
<div id="progressBar">
</div>
</div>
</div>
<div class="task-list" id="taskList">
</div>
<button class="quick-add" id="showAdd">+ Add a task</button>
<form class="form-card" id="taskForm">
<label>Task name</label>
<input id="name" required placeholder="e.g. Finish science worksheet">
<div class="toggle">
<button type="button" class="active" data-mode="once">For one day</button>
<button type="button" data-mode="daily">Every day</button>
<button type="button" data-mode="weekly">Every week</button>
</div>
<div class="form-row">
<div>
<label id="dateLabel">Date</label>
<input id="date" type="date" required>
</div>
<div>
<label id="weekdayLabel" hidden>Weekday</label>
<select id="weekday" hidden>
<option value="0">Sunday</option>
<option value="1">Monday</option>
<option value="2">Tuesday</option>
<option value="3">Wednesday</option>
<option value="4">Thursday</option>
<option value="5">Friday</option>
<option value="6">Saturday</option>
</select>
</div>
</div>
<label class="checkline">
<input id="showCalendar" type="checkbox" checked> Also show it on my calendar</label>
<button class="save">Add task</button>
</form>
</section>
<section class="screen" id="calendarScreen">
<div class="calendar-head">
<button id="prev" aria-label="Previous month">‹</button>
<h2 id="month">
</h2>
<button id="next" aria-label="Next month">›</button>
</div>
<div class="week">
<span>Sun</span>
<span>Mon</span>
<span>Tue</span>
<span>Wed</span>
<span>Thu</span>
<span>Fri</span>
<span>Sat</span>
</div>
<div class="calendar" id="calendar">
</div>
<div class="cal-summary">
<h3 id="selectedTitle">Tasks for today</h3>
<div id="calendarTasks">
</div>
</div>
</section>
<nav class="bottom">
<button class="active" data-screen="tasks">
<i>☑</i>Tasks</button>
<button data-screen="calendar">
<i>▦</i>Calendar</button>
</nav>
</main>
<script>
const $=x=>document.getElementById(x),pad=n=>String(n).padStart(2,'0'),key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`,pretty=d=>d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'});let selected=new Date(2025,9,21),view=new Date(2025,9,1),mode='once';let tasks=[{id:1,name:'Design for landing page',date:'2025-10-21',calendar:true,done:false,mode:'once'},{id:2,name:'Finish math homework',date:'2025-10-21',calendar:false,done:false,mode:'once'},{id:3,name:'Weekly planner review',weekday:2,calendar:true,done:false,mode:'weekly'},{id:4,name:'Clean backpack',weekday:0,calendar:false,done:false,mode:'weekly'}];function matches(t,d){return t.mode==='daily'||(t.mode==='weekly'?t.weekday===d.getDay():t.date===key(d))}function forDay(d){return tasks.filter(t=>matches(t,d))}function removeTask(id){tasks=tasks.filter(t=>t.id!==id);render()}function removeFromCalendar(id){let task=tasks.find(t=>t.id===id);if(task){task.calendar=false;render()}}function renderTasks(){let day=forDay(selected),done=day.filter(t=>t.done).length;$('taskHeading').textContent=selected.toLocaleDateString('en-US',{weekday:'long'});$('taskDate').textContent=selected.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});$('taskList').innerHTML=day.length?day.map(t=>`<div class="task ${t.done?'done':''}"><input type="checkbox" data-id="${t.id}" ${t.done?'checked':''}><span class="task-content"><span class="task-name">${t.name}</span><span class="task-meta">${t.mode==='daily'?'Every day':t.mode==='weekly'?'Every '+selected.toLocaleDateString('en-US',{weekday:'long'}):'Scheduled for today'}${t.calendar?' · On calendar':''}</span></span><span class="task-actions"><button class="task-action" data-remove="${t.id}" type="button" title="Delete task">Delete</button>${t.calendar?`<button class="task-action" data-calendar-remove="${t.id}" type="button" title="Remove from calendar">Remove calendar</button>`:''}</span></div>`).join(''):'<div class="empty">Nothing scheduled for this day.</div>';$('progressText').textContent=day.length?Math.round(done/day.length*100)+'%':'0%';$('progressBar').style.width=day.length?done/day.length*100+'%':'0%';$('taskList').querySelectorAll('input[data-id]').forEach(c=>c.onchange=()=>{tasks.find(t=>t.id===+c.dataset.id).done=c.checked;render()});$('taskList').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>removeTask(+b.dataset.remove));$('taskList').querySelectorAll('[data-calendar-remove]').forEach(b=>b.onclick=()=>removeFromCalendar(+b.dataset.calendarRemove))}function renderCalendar(){let y=view.getFullYear(),m=view.getMonth(),first=new Date(y,m,1).getDay(),total=new Date(y,m+1,0).getDate(),last=new Date(y,m,0).getDate(),h='';$('month').textContent=view.toLocaleDateString('en-US',{month:'long',year:'numeric'});for(let i=0;i<42;i++){let d,mm=m,yy=y,out='';if(i<first){d=last-first+i+1;mm--;if(mm<0){mm=11;yy--}out=' out'}else if(i>=first+total){d=i-first-total+1;mm++;if(mm>11){mm=0;yy++}out=' out'}else d=i-first+1;let date=new Date(yy,mm,d),has=forDay(date).some(t=>t.calendar);h+=`<button class="day${out}${key(date)===key(selected)?' selected':''}${has?' has':''}" data-day="${key(date)}"><span>${d}</span></button>`}$('calendar').innerHTML=h;$('calendar').querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{selected=new Date(b.dataset.day+'T12:00:00');view=new Date(selected.getFullYear(),selected.getMonth(),1);render();switchScreen('tasks')});let day=forDay(selected).filter(t=>t.calendar);$('selectedTitle').textContent='Calendar tasks for '+pretty(selected);$('calendarTasks').innerHTML=day.length?day.map(t=>`<div class="task"><span class="task-content"><span class="task-name">${t.name}</span></span><button class="task-action" data-calendar-remove="${t.id}" type="button">Remove calendar</button></div>`).join(''):'<div class="empty">No calendar items for this day.</div>';$('calendarTasks').querySelectorAll('[data-calendar-remove]').forEach(b=>b.onclick=()=>removeFromCalendar(+b.dataset.calendarRemove))}function render(){$('date').value=key(selected);$('weekday').value=selected.getDay();renderTasks();renderCalendar()}function switchScreen(s){$('tasksScreen').classList.toggle('active',s==='tasks');$('calendarScreen').classList.toggle('active',s==='calendar');$('title').textContent=s==='tasks'?'Task List':'Calendar';document.querySelectorAll('[data-screen]').forEach(b=>b.classList.toggle('active',b.dataset.screen===s))}document.querySelectorAll('[data-screen]').forEach(b=>b.onclick=()=>switchScreen(b.dataset.screen));$('prev').onclick=()=>{view.setMonth(view.getMonth()-1);renderCalendar()};$('next').onclick=()=>{view.setMonth(view.getMonth()+1);renderCalendar()};function openAdd(){switchScreen('tasks');$('taskForm').classList.add('open');$('name').focus()}$('showAdd').onclick=openAdd;document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));let recurring=mode!=='once';let weekly=mode==='weekly';$('dateLabel').hidden=recurring;$('date').hidden=recurring;$('date').required=!recurring;$('weekdayLabel').hidden=!weekly;$('weekday').hidden=!weekly});$('taskForm').onsubmit=e=>{e.preventDefault();let t={id:Date.now(),name:$('name').value.trim(),calendar:$('showCalendar').checked,done:false,mode};if(!t.name)return;if(mode==='weekly')t.weekday=+$('weekday').value;else if(mode==='once')t.date=$('date').value;tasks.push(t);if(mode==='once')selected=new Date(t.date+'T12:00:00');$('name').value='';$('taskForm').classList.remove('open');render()};render();
</script>
</body>
</html>
